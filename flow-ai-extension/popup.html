<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flow AI Ultra Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      width: 100%;
      min-width: 330px;
      max-width: 440px;
      margin: 0 auto;
      background: radial-gradient(circle at top, #111827 0%, #030712 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 8px;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .glow-header {
      border: 1px solid rgba(249, 115, 22, 0.5);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.25);
    }
    .touch-btn {
      touch-action: manipulation;
      user-select: none;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .touch-btn:active {
      transform: scale(0.96);
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="space-y-2 antialiased">

  <!-- HEADER ELEGAN -->
  <header class="glass-card glow-header flex items-center justify-between py-2 px-3">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white text-xs shadow-lg shadow-orange-500/30">
        <i class="fa-solid fa-bolt-lightning"></i>
      </div>
      <div>
        <div class="text-[11px] font-black tracking-tight text-white flex items-center gap-1.5">
          <span>Flow AI Studio</span>
          <span class="px-1.5 py-0.2 rounded-full bg-orange-500/20 text-orange-400 text-[8px] font-mono font-bold border border-orange-500/40">v21.0 Fiber</span>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-1.5">
      <button id="btn-save-all-json" class="touch-btn px-2 py-0.5 rounded-md bg-slate-800 hover:bg-slate-700 text-amber-300 text-[9px] font-bold border border-slate-700">
        <i class="fa-solid fa-floppy-disk mr-0.5"></i>Save
      </button>
      <button id="btn-reset-cache-all" class="touch-btn px-2 py-0.5 rounded-md bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-400 text-[9px] font-bold border border-slate-700">
        <i class="fa-solid fa-rotate-right mr-0.5"></i>Reset
      </button>
    </div>
  </header>

  <!-- KELOMPOK BAR -->
  <div class="glass-card p-2 space-y-1.5">
    <div class="flex items-center justify-between px-1">
      <span class="text-[9.5px] font-bold text-amber-400 font-mono flex items-center gap-1">
        <i class="fa-solid fa-folder-open text-orange-400"></i> Kelompok Preset:
      </span>
      <div class="flex items-center gap-1">
        <button id="btn-add-group" class="touch-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-amber-300 text-[8.5px] font-bold border border-slate-700">+ Kelompok</button>
        <button id="btn-delete-group" class="touch-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-rose-900 text-slate-400 text-[8.5px] font-bold border border-slate-700"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <div id="group-pills-container" class="flex items-center gap-1.5 overflow-x-auto pb-0.5"></div>
  </div>

  <!-- MODE SWITCH TABS -->
  <div class="grid grid-cols-2 gap-1 p-1 bg-black/60 rounded-xl border border-slate-800">
    <button id="mode-tab-brutal" class="touch-btn py-1.5 rounded-lg text-[10px] font-black transition flex items-center justify-center gap-1.5 bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-md shadow-orange-500/20">
      <i class="fa-solid fa-layer-group text-[9px]"></i>
      <span>Mode Brutal (3 Foto)</span>
    </button>
    <button id="mode-tab-storyboard" class="touch-btn py-1.5 rounded-lg text-[10px] font-extrabold text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-clapperboard text-[9px]"></i>
      <span>1 Foto Storyboard</span>
    </button>
  </div>

  <!-- SECTION 1: MODE BRUTAL -->
  <div id="section-brutal-mode" class="space-y-2">
    <div class="glass-card p-2 space-y-2">
      <div class="grid grid-cols-3 gap-2">
        <label for="ext-file-product" class="touch-btn relative block aspect-square rounded-xl bg-slate-950/80 border-2 border-dashed border-slate-800 hover:border-orange-500 cursor-pointer overflow-hidden flex flex-col items-center justify-center group" id="box-product">
          <img id="ext-thumb-product" class="hidden w-full h-full object-cover">
          <div id="ext-placeholder-product" class="p-1 text-center text-slate-500 group-hover:text-amber-400">
            <i class="fa-solid fa-box-open text-base"></i>
            <div class="text-[8px] font-bold mt-1">+ Produk</div>
          </div>
          <input type="file" id="ext-file-product" accept="image/*" class="hidden">
        </label>

        <label for="ext-file-model" class="touch-btn relative block aspect-square rounded-xl bg-slate-950/80 border-2 border-dashed border-slate-800 hover:border-orange-500 cursor-pointer overflow-hidden flex flex-col items-center justify-center group" id="box-model">
          <img id="ext-thumb-model" class="hidden w-full h-full object-cover">
          <div id="ext-placeholder-model" class="p-1 text-center text-slate-500 group-hover:text-amber-400">
            <i class="fa-solid fa-user text-base"></i>
            <div class="text-[8px] font-bold mt-1">+ Model</div>
          </div>
          <input type="file" id="ext-file-model" accept="image/*" class="hidden">
        </label>

        <label for="ext-file-location" class="touch-btn relative block aspect-square rounded-xl bg-slate-950/80 border-2 border-dashed border-slate-800 hover:border-orange-500 cursor-pointer overflow-hidden flex flex-col items-center justify-center group" id="box-location">
          <img id="ext-thumb-location" class="hidden w-full h-full object-cover">
          <div id="ext-placeholder-location" class="p-1 text-center text-slate-500 group-hover:text-amber-400">
            <i class="fa-solid fa-mountain-sun text-base"></i>
            <div class="text-[8px] font-bold mt-1">+ Lokasi</div>
          </div>
          <input type="file" id="ext-file-location" accept="image/*" class="hidden">
        </label>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between">
          <label class="text-[9px] font-bold text-amber-400 font-mono uppercase">Prompt Video Motion:</label>
          <button id="btn-save-brutal-preset" class="touch-btn px-2 py-0.2 rounded bg-emerald-950 text-emerald-300 text-[8px] font-bold border border-emerald-500/40">Save</button>
        </div>
        <textarea id="ext-brutal-prompt" rows="2" placeholder="Ketik prompt motion video di sini..." class="w-full bg-slate-950/90 border border-slate-800 rounded-xl p-2 text-[9.5px] text-white placeholder-slate-600 focus:outline-none focus:border-orange-500 leading-relaxed resize-none"></textarea>
      </div>

      <div class="flex items-center justify-between text-[9px] text-slate-300 px-1">
        <span class="font-bold">Jeda Antar Kelompok:</span>
        <select id="select-interval-brutal" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-0.5 text-amber-400 font-mono text-[9px] outline-none">
          <option value="10" selected>10 Detik</option>
          <option value="15">15 Detik</option>
          <option value="20">20 Detik</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-0.5">
        <button id="btn-inject-brutal-single" class="touch-btn py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300 text-[10px] font-bold flex items-center justify-center gap-1.5 shadow">
          <i class="fa-solid fa-play text-orange-400 text-[8.5px]"></i>
          <span>Jalankan (1x)</span>
        </button>

        <button id="btn-inject-brutal-all-groups" class="touch-btn py-2 rounded-xl bg-gradient-to-r from-amber-500 via-orange-600 to-red-600 text-white font-extrabold text-[10px] shadow-lg shadow-orange-600/30 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-[8.5px]"></i>
          <span>Auto Semua Kelompok</span>
        </button>
      </div>
    </div>
  </div>

  <!-- SECTION 2: MODE STORYBOARD -->
  <div id="section-storyboard-mode" class="space-y-2 hidden">
    <div class="flex items-center justify-between px-1">
      <span class="text-[10px] font-bold text-white flex items-center gap-1">
        <i class="fa-solid fa-clapperboard text-orange-400"></i> Scene Storyboard
      </span>
      <button id="btn-add-scene" class="touch-btn px-2.5 py-0.5 rounded-lg bg-slate-800 text-amber-300 hover:text-white text-[9px] font-bold border border-slate-700 flex items-center gap-1">
        <i class="fa-solid fa-plus text-[8px]"></i>
        <span>+ Scene</span>
      </button>
    </div>

    <!-- Container Scene List -->
    <div id="ext-scenes-container" class="space-y-2 max-h-[300px] overflow-y-auto pr-0.5"></div>

    <div class="glass-card p-2 space-y-1.5">
      <div class="flex items-center justify-between text-[9px] text-slate-300">
        <span class="font-bold">Jeda Antar Scene / Kelompok:</span>
        <select id="select-interval-seq" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-0.5 text-amber-400 font-mono text-[9px] outline-none">
          <option value="10" selected>10 Detik</option>
          <option value="15">15 Detik</option>
          <option value="20">20 Detik</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="btn-run-storyboard-all-groups" class="touch-btn py-2 rounded-xl bg-gradient-to-r from-amber-500 via-orange-600 to-red-600 text-white font-extrabold text-[10px] flex items-center justify-center gap-1.5 shadow-lg shadow-orange-600/30">
          <i class="fa-solid fa-play text-[8.5px]"></i>
          <span>Auto Semua Kelompok</span>
        </button>

        <button id="btn-copy-all-prompts" class="touch-btn py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[10px] font-bold flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-copy text-amber-400 text-[8.5px]"></i>
          <span>Salin Prompt</span>
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
