<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AffiliateGo Flow Injector</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-width: 280px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(249, 115, 22, 0.2);
      border: 1px solid rgba(249, 115, 22, 0.5);
      color: #fb923c;
      font-size: 11px;
      font-weight: 800;
      border-radius: 99px;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #ffffff;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    #btn-inject {
      width: 100%;
      min-height: 44px;
      padding: 12px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
      display: block;
    }
    #btn-inject:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      color: #10b981;
      display: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="badge">AFFILIATEGO VIP</div>
  <h2>Google Flow Sesi</h2>
  <p>Suntikkan akun sesi Google dan langsung buka project Flow AI.</p>
  
  <button type="button" id="btn-inject">
    Buka Google Flow AI
  </button>
  
  <div id="status" class="status">Sesi aktif! Membuka...</div>

  <script src="popup.js"></script>
</body>
</html>
